name = "shade-tracker-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# postgres.js (Supabase) gets small pure-JS stand-ins for the Node APIs it imports,
# so the Worker needs no "nodejs_compat" compatibility flag.
[alias]
"node:buffer" = "./node_modules/buffer/index.js"
"node:events" = "./node_modules/events/events.js"
"node:stream" = "./shims/stream.js"

# Optional: the old D1 database. Kept bound only so the first sign-in can copy its data into Supabase.
[[d1_databases]]
binding = "DB"
database_name = "shade-tracker"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Realtime hub (WebSockets)
[[durable_objects.bindings]]
name = "HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

[vars]
# Your Vercel URL(s), comma separated. "*" allows any site (fine for testing).
ALLOWED_ORIGINS = "*"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   JWT_SECRET      long random text used to sign logins
#   ADMIN_USER      first admin's username (used only while there are no users)
#   ADMIN_PASSWORD  first admin's password
